<!DOCTYPE html>

<html lang="en">
<head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Private Support Chat | Clutch Zone</title><link href="styles.css?v=70" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer="" src="support-chat.js"></script><meta content="noindex, nofollow, noarchive" name="robots"/><meta content="strict-origin-when-cross-origin" name="referrer"/><link href="favicon.ico" rel="icon" sizes="any"/><link href="favicon-32.png" rel="icon" type="image/png" sizes="32x32"/><link href="apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/></head>
<body class="admin-chat-page">
<header class="top"><div class="wrap nav"><a class="brand" href="admin.html"><img alt="Clutch Zone" src="clutch-zone-logo.png"/><span>CLUTCH ZONE ADMIN</span></a></div></header>
<div class="backbar wrap"><button class="back-button" id="backButton" type="button"><span class="back-icon">←</span><span>BACK TO SUPPORT</span></button></div>
<main class="wrap support-chat-detail">
<section class="support-chat-hero"><div><div class="eyebrow">🔒 PRIVATE SUPPORT</div><h1 id="playerTitle">Loading…</h1><p id="playerMeta">Player support request</p></div><div class="private-badge">ADMIN ONLY</div></section>
<section class="chat-panel support-detail-panel"><div class="chat-head inner-head"><div><h2>💬 Private Chat</h2><p>Sirf selected player + Clutch Zone Admin</p></div><span class="live-pill">● LIVE</span></div><div class="notice" id="chatNotice">Chat load ho raha hai…</div><div class="chat-messages" id="privateChatMessages"></div><form class="chat-compose" id="privateChatForm"><input autocomplete="off" maxlength="1500" name="message" placeholder="Player ko reply likhein…" required=""/><button class="primary" type="submit">SEND REPLY ➤</button></form></section>
</main><div class="toast" id="toast"></div><div aria-hidden="true" class="cz-confirm" id="confirmModal"><div class="cz-confirm-box"><div class="cz-confirm-icon">!</div><div><div class="eyebrow">CONFIRM ACTION</div><h3 id="confirmTitle">Delete this message?</h3><p id="confirmText">This action cannot be undone.</p></div><div class="cz-confirm-actions"><button class="light" id="confirmCancel" type="button">CANCEL</button><button class="danger" id="confirmOk" type="button">DELETE</button></div></div></div>
</body></html>
