<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Clutch Zone multi-device showcase</title><desc id="desc">Phone, tablet, laptop and desktop floating together.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd21f" stop-opacity=".22"/><stop offset=".5" stop-color="#8d35f3" stop-opacity=".25"/><stop offset="1" stop-color="#3e8bff" stop-opacity=".22"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a3948"/><stop offset="1" stop-color="#111119"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd21f"/><stop offset="1" stop-color="#ff7b3d"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b88cff"/><stop offset="1" stop-color="#8d35f3"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7fc4ff"/><stop offset="1" stop-color="#3e8bff"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity=".35"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<circle cx="380" cy="260" r="180" fill="url(#bg)" filter="url(#glow)"/>
<ellipse cx="380" cy="448" rx="270" ry="25" fill="#000" opacity=".22" filter="url(#glow)"/>
<!-- phone -->
<g transform="translate(70 95) rotate(-7 82 170)" filter="url(#shadow)">
 <rect x="0" y="0" width="165" height="315" rx="30" fill="url(#glass)" stroke="#ffd21f" stroke-width="4"/>
 <rect x="13" y="18" width="139" height="279" rx="21" fill="#090910" stroke="#ffffff" stroke-opacity=".18"/>
 <rect x="62" y="8" width="41" height="8" rx="4" fill="#555466"/>
 <circle cx="82" cy="285" r="7" fill="none" stroke="#ffd21f" stroke-width="2"/>
 <circle cx="82" cy="145" r="40" fill="#ffd21f" opacity=".12"/><text x="82" y="151" fill="#fff" font-size="19" text-anchor="middle" font-family="Arial" font-weight="800">MOBILE</text>
</g>
<!-- tablet -->
<g transform="translate(510 55) rotate(7 105 160)" filter="url(#shadow)">
 <rect x="0" y="0" width="210" height="325" rx="25" fill="url(#glass)" stroke="#a987ff" stroke-width="4"/>
 <rect x="13" y="16" width="184" height="289" rx="16" fill="#090910" stroke="#fff" stroke-opacity=".18"/>
 <circle cx="105" cy="313" r="5" fill="#a987ff"/>
 <circle cx="105" cy="155" r="54" fill="#8d35f3" opacity=".16"/><text x="105" y="161" fill="#fff" font-size="20" text-anchor="middle" font-family="Arial" font-weight="800">TABLET</text>
</g>
<!-- laptop -->
<g transform="translate(225 260)" filter="url(#shadow)">
 <rect x="0" y="0" width="315" height="178" rx="13" fill="url(#glass)" stroke="#ff6978" stroke-width="4"/>
 <rect x="13" y="14" width="289" height="146" rx="7" fill="#090910" stroke="#fff" stroke-opacity=".15"/>
 <circle cx="157" cy="84" r="42" fill="#ff4f91" opacity=".12"/><text x="157" y="90" fill="#fff" font-size="20" text-anchor="middle" font-family="Arial" font-weight="800">LAPTOP</text>
 <path d="M-38 183h391l-31 30H-7z" fill="#262532" stroke="#ff6978" stroke-width="4"/>
 <rect x="112" y="190" width="90" height="8" rx="4" fill="#666273"/>
</g>
<!-- desktop -->
<g transform="translate(265 25)" filter="url(#shadow)">
 <rect x="0" y="0" width="225" height="145" rx="12" fill="url(#glass)" stroke="#65aaff" stroke-width="4"/>
 <rect x="13" y="13" width="199" height="111" rx="7" fill="#090910" stroke="#fff" stroke-opacity=".15"/>
 <circle cx="112" cy="67" r="35" fill="#3e8bff" opacity=".13"/><text x="112" y="73" fill="#fff" font-size="17" text-anchor="middle" font-family="Arial" font-weight="800">DESKTOP</text>
 <path d="M112 145v31M72 181h80" stroke="#65aaff" stroke-width="6" stroke-linecap="round"/>
</g>
<g font-family="Arial" font-weight="900" letter-spacing="3" font-size="12" fill="#fff"><text x="380" y="490" text-anchor="middle">ONE COMMUNITY • EVERY SCREEN</text></g>
</svg>
